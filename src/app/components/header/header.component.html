<header class="header">
  <a routerLink="/" class="logo">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <rect x="4" y="16" width="14" height="14" rx="4" fill="#FF6B6B" />
      <rect x="22" y="16" width="14" height="14" rx="4" fill="#4ECDC4" />
      <circle cx="20" cy="10" r="7" fill="#FFD93D" />
    </svg>
    <span class="logo-text">Jugue<span class="logo-accent">tón</span></span>
  </a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
    <a href="#">Ofertas</a>
    <a href="#">Contacto</a>
  </nav>

  <div class="actions">
    <button aria-label="Buscar" class="icon-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D2A26" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </button>
    <a routerLink="/carrito" aria-label="Carrito" class="cart-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      @if (itemCount() > 0) {
        <span class="cart-badge">{{ itemCount() }}</span>
      }
    </a>
  </div>
</header>
